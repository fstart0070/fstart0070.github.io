  <script>
    (function () {
      function applyVp() {
        var w = window.innerWidth || document.documentElement.clientWidth || 0;
        var flag = w <= 900 ? "narrow" : "wide";
        document.documentElement.setAttribute("data-vp", flag);
        if (document.body) document.body.setAttribute("data-vp", flag);
      }
      applyVp();
      document.addEventListener("DOMContentLoaded", applyVp);
      window.addEventListener("resize", applyVp, { passive: true });
    })();
  </script>
